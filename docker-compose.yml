services:
  app:
    image: nomad
    container_name: nomad
    ports:
      - "8910:8910"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-}
      # - ALLOWED_ORIGINS=https://yourdomain.com  # Optional: restrict CORS to specific origins
      - PORT=8910
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8910/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
